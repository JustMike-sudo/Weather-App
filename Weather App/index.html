<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cel-Shaded Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-app">
    <header>
      <input type="text" id="city-input" placeholder="Search city...">
      <button id="search-btn">Search</button>
    </header>

    <main>
      <div id="city-name" class="location">Loading...</div>
      <div class="icon">🌡️</div>
      <div id="temperature" class="temperature">--°</div>
      <div id="description" class="condition">Fetching data...</div>
    </main>

    <section>
      <ul class="forecast" id="forecast"></ul>
    </section>
  </div>

  <script src="script.js"></script>
  <script>
    // hook search button to the JS function
    document.getElementById("search-btn").addEventListener("click", searchWeather);
  </script>
</body>
</html>
