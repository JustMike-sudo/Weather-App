<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cel-shaded weather app with a 7-day forecast, powered by Open-Meteo. No API key needed.">
  <title>Cel-Shaded Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="weather-app">
    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="city-input">City</label>
      <input type="text" id="city-input" placeholder="Search city..." autocomplete="off" required>
      <button type="submit" id="search-btn">Search</button>
      <button type="button" id="locate-btn" class="icon-btn" title="Use my location" aria-label="Use my location">📍</button>
    </form>

    <ul class="suggestions" id="suggestions" hidden></ul>

    <section class="current" aria-live="polite" aria-busy="false" id="current">
      <div class="location" id="city-name">Search for a city</div>
      <div class="icon" id="icon" aria-hidden="true">🌡️</div>
      <div class="temperature" id="temperature">--°</div>
      <div class="condition" id="description">Enter a city to see the weather</div>
      <dl class="details" id="details" hidden>
        <div><dt>Feels like</dt><dd id="feels-like">--°</dd></div>
        <div><dt>Humidity</dt><dd id="humidity">--</dd></div>
        <div><dt>Wind</dt><dd id="wind">--</dd></div>
      </dl>
    </section>

    <div class="units" role="group" aria-label="Temperature unit">
      <button type="button" class="unit" data-unit="C" aria-pressed="true">°C</button>
      <button type="button" class="unit" data-unit="F" aria-pressed="false">°F</button>
    </div>

    <section aria-label="7-day forecast">
      <ul class="forecast" id="forecast"></ul>
    </section>

    <p class="credit">Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </main>

  <script src="weather.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
